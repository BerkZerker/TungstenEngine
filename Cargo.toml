[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license-file = "LICENSE"

[workspace.dependencies]
tungsten-core = { path = "crates/tungsten-core" }
tungsten-stream = { path = "crates/tungsten-stream" }
tungsten-render = { path = "crates/tungsten-render" }
glam = "0.34"
bytemuck = { version = "1.25", features = ["derive"] }
crossbeam-channel = "0.5"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
winit = "0.30"
pollster = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
